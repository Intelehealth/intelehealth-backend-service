server {
    listen 80;
    server_name nezazi.example.com nezazi.intelehealth.org nezazi.local;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# Notes:
# - Ensure your reverse proxy preserves the Host header (important for hostname-based tenant routing).
# - Replace upstream and server_name with production values and add TLS config for production.
