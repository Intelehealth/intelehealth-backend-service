name: Queue Microservice Deploy

on:
  push:
    branches: [development_master_qms_service]
    paths:
      - 'queue-microservice/**'
  workflow_dispatch: {}

env:
  DOCKER_IMAGE_NAME: queue-microservice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} ./queue-microservice
          docker save $DOCKER_IMAGE_NAME:${{ github.sha }} > app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: queue-microservice-image
          path: app-image.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # a failure on one server won't cancel the other
      matrix:
        include:
          - target: dev
            host_secret: DEV_HOST
            user_secret: DEV_USER
            key_secret: DEV_SSH_KEY
          - target: demoai
            host_secret: DEMOAI_HOST
            user_secret: DEV_USER       # change to DEMOAI_USER if demoai uses a different user
            key_secret: DEV_SSH_KEY     # change to DEMOAI_SSH_KEY if demoai uses a different key
    name: deploy (${{ matrix.target }})
    env:
      REMOTE_PORT: 22
      ENV_FILE_PATH: /home/ubuntu/deploy/queue-microservice/.env
      PEM_FOLDER_PATH: /home/ubuntu/deploy/queue-microservice/.pem
      REMOTE_HOST: ${{ secrets[matrix.host_secret] }}
      REMOTE_USER: ${{ secrets[matrix.user_secret] }}
      SSH_PRIVATE_KEY: ${{ secrets[matrix.key_secret] }}
      TARGET_NAME: ${{ matrix.target }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: queue-microservice-image

      - name: Deploy to ${{ matrix.target }} host
        run: |
          if [ -z "$REMOTE_HOST" ]; then
            echo "Error: host secret for '$TARGET_NAME' is empty or not set"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          REMOTE_TAR="/tmp/app-image-queue-microservice-${{ github.run_id }}.tar"

          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -P $REMOTE_PORT \
              app-image.tar \
              $REMOTE_USER@$REMOTE_HOST:$REMOTE_TAR

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST <<EOF
            set -e
            DOCKER_IMAGE_NAME="${{ env.DOCKER_IMAGE_NAME }}"
            ENV_FILE_PATH="${{ env.ENV_FILE_PATH }}"
            PEM_FOLDER_PATH="${{ env.PEM_FOLDER_PATH }}"
            REMOTE_TAR="$REMOTE_TAR"

            docker load -i "\$REMOTE_TAR"
            rm "\$REMOTE_TAR"

            docker stop \$DOCKER_IMAGE_NAME || true
            docker rm \$DOCKER_IMAGE_NAME || true

            if [ ! -f "\$ENV_FILE_PATH" ]; then
              echo "Error: .env file not found at \$ENV_FILE_PATH"
              exit 1
            fi

            if [ ! -d "\$PEM_FOLDER_PATH" ]; then
              echo "Error: .pem folder not found at \$PEM_FOLDER_PATH"
              exit 1
            fi

            docker ps -a | grep queue-microservice | awk '{print \$1}' | xargs -r docker rm -f || true

            fuser -k 3600/tcp || true

            sleep 2

            docker run -d \
              --name \$DOCKER_IMAGE_NAME \
              --restart unless-stopped \
              -p 3600:3600 \
              --env-file \$ENV_FILE_PATH \
              -v \$PEM_FOLDER_PATH:/app/.pem \
              \$DOCKER_IMAGE_NAME:${{ github.sha }}

            docker image prune -f
            echo "queue-microservice deployment to ${{ matrix.target }} completed successfully"
          EOF
