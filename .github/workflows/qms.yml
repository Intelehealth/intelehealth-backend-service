name: Queue Microservice Deploy-QMS
 
on:
  push:
    branches: [development_master_qms_service]
    paths:
      - 'queue-microservice/**'
  workflow_dispatch: {}
 
env:
  DOCKER_IMAGE_NAME: queue-microservice
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} ./queue-microservice
          docker save $DOCKER_IMAGE_NAME:${{ github.sha }} > app-image.tar
 
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: queue-microservice-image
          path: app-image.tar
          retention-days: 1
 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      REMOTE_PORT: 22
      ENV_FILE_PATH: /home/ubuntu/deploy/queue-microservice/.env
      PEM_FOLDER_PATH: /home/ubuntu/deploy/queue-microservice/.pem
      REMOTE_HOST: ${{ secrets.DEV_HOST }}
      REMOTE_USER: ${{ secrets.DEV_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: queue-microservice-image
 
      - name: Deploy to dev host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
 
          REMOTE_TAR="/tmp/app-image-queue-microservice-${{ github.run_id }}.tar"
 
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -P $REMOTE_PORT \
              app-image.tar \
              $REMOTE_USER@$REMOTE_HOST:$REMOTE_TAR
 
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST <<EOF
            set -e
            DOCKER_IMAGE_NAME="${{ env.DOCKER_IMAGE_NAME }}"
            ENV_FILE_PATH="${{ env.ENV_FILE_PATH }}"
            PEM_FOLDER_PATH="${{ env.PEM_FOLDER_PATH }}"
            REMOTE_TAR="$REMOTE_TAR"
 
            docker load -i "\$REMOTE_TAR"
            rm "\$REMOTE_TAR"

            if [ ! -f "\$ENV_FILE_PATH" ]; then
              echo "Error: .env file not found at \$ENV_FILE_PATH"
              exit 1
            fi

            if [ ! -d "\$PEM_FOLDER_PATH" ]; then
              echo "Error: .pem folder not found at \$PEM_FOLDER_PATH"
              exit 1
            fi

            # Run migrations from the new image as a one-off container BEFORE
            # touching the running one — if they fail, \`set -e\` aborts the
            # script here and the old container is left serving traffic.
            docker run --rm \
              --env-file \$ENV_FILE_PATH \
              \$DOCKER_IMAGE_NAME:${{ github.sha }} \
              npm run migrate

            docker stop \$DOCKER_IMAGE_NAME || true
            docker rm \$DOCKER_IMAGE_NAME || true

            docker ps -a | grep queue-microservice | awk '{print $1}' | xargs -r docker rm -f || true

            # Belt-and-braces: the name-based cleanup above does nothing if
            # host port 3600 is actually held by some OTHER container — a
            # stale one from a previous failed deploy, or a manual run under
            # a different name. Find it by which host port it PUBLISHES
            # instead, and remove that.
            PORT_HOLDERS=\$(docker ps -q --filter "publish=3600")
            if [ -n "\$PORT_HOLDERS" ]; then
              echo "Port 3600 is held by another container — removing it: \$PORT_HOLDERS"
              docker rm -f \$PORT_HOLDERS || true
            fi

            fuser -k 3600/tcp || true

            # Releasing a published port is not always instant once the
            # container is gone; poll briefly instead of a fixed sleep that
            # could still lose the race under load.
            for i in \$(seq 1 15); do
              if ! docker ps -q --filter "publish=3600" | grep -q .; then
                break
              fi
              sleep 1
            done

            docker run -d \
              --name \$DOCKER_IMAGE_NAME \
              --restart unless-stopped \
              -p 3600:3600 \
              --env-file \$ENV_FILE_PATH \
              -v \$PEM_FOLDER_PATH:/app/.pem \
              --mount type=bind,src=/etc/letsencrypt,dst=/etc/letsencrypt,ro \
              \$DOCKER_IMAGE_NAME:${{ github.sha }}
 
            docker image prune -f
            echo "queue-microservice deployment to dev completed successfully"
          EOF
 
