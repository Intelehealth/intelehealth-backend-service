name: Portal Tests

on:
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/portal-tests.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails below 100% line, branch and function coverage on the Achievements / heartbeat files.
      - name: Run tests with coverage
        run: npm run test:coverage
