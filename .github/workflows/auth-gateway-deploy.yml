# Auth Gateway Deploy
#
# Builds the auth-gateway Docker image once and deploys it to one or more remote hosts.
#
# Triggers:
#   - push to development_master (auth-gateway/** changes) -> deploys to ALL hosts
#   - workflow_dispatch (manual) -> deploys to selected hosts via checkboxes
#
# Jobs:
#   1. prepare-matrix  Decides which environments to deploy, computes needed archs + migrations
#   2. build           Builds the amd64 image natively and uploads it as an artifact
#   3. build-arm64     Builds the arm64 image natively and uploads it as an artifact
#   4. deploy          Matrix job - downloads the matching-arch artifact and deploys to each host
#
# Required secrets:
#   DEV_HOST, TURN_HOST    SSH hostnames/IPs
#   DEV_USER               SSH username
#   DEV_SSH_KEY            SSH private key
#
# Architecture mapping (hardcoded): each environment maps to a target arch so we build ONLY
# what's needed, natively, on the matching runner (no QEMU). Update `arch_of` in prepare-matrix
# and the artifact name in deploy when adding/changing a host.
#
# To add a new host: add a secret for the hostname, map it in the deploy job env block,
# add a case in "Resolve host", add a boolean input, and add it to the push matrix.

name: Auth Gateway Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: 'Deploy to DEV host'
        type: boolean
        default: true
     
      deploy_ttxai:
        description: 'Deploy to TTXAI host'
        type: boolean
        default: false
      deploy_testturn:
        description: 'Deploy to TESTTURN host'
        type: boolean
        default: false
      deploy_turn:
        description: 'Deploy to TURN host'
        type: boolean
        default: false
      deploy_pathqa:
        description: 'Deploy to PATHQA host'
        type: boolean
        default: false
  push:
    branches: [development_master]
    paths:
      - 'auth-gateway/**'

env:
  DOCKER_IMAGE_NAME: auth-gateway

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      archs: ${{ steps.set-matrix.outputs.archs }}
      migrations_changed: ${{ steps.check-migrations.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for migration file changes
        id: check-migrations
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^auth-gateway/migrations/" \
              && echo "changed=true" >> $GITHUB_OUTPUT \
              || echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build deployment matrix
        id: set-matrix
        run: |
          # Hardcoded architecture mapping. All hosts are amd64 unless listed here.
          arch_of() {
            case "$1" in
              pathqa) echo "arm64" ;;
              *)      echo "amd64" ;;
            esac
          }
          includes='[]'
          if [ "${{ github.event_name }}" == "push" ]; then
            for env in dev turn ttxai testturn pathqa; do
              includes=$(echo "$includes" | jq -c --arg env "$env" --arg arch "$(arch_of "$env")" '. += [{"environment":$env,"arch":$arch}]')
            done
          else
            if [ "${{ inputs.deploy_dev }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c --arg arch "$(arch_of dev)" '. += [{"environment":"dev","arch":$arch}]')
            fi
          
            if [ "${{ inputs.deploy_ttxai }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c --arg arch "$(arch_of ttxai)" '. += [{"environment":"ttxai","arch":$arch}]')
            fi
            if [ "${{ inputs.deploy_turn }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c --arg arch "$(arch_of turn)" '. += [{"environment":"turn","arch":$arch}]')
            fi
            if [ "${{ inputs.deploy_testturn }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c --arg arch "$(arch_of testturn)" '. += [{"environment":"testturn","arch":$arch}]')
            fi
            if [ "${{ inputs.deploy_pathqa }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c --arg arch "$(arch_of pathqa)" '. += [{"environment":"pathqa","arch":$arch}]')
            fi
          fi
          archs=$(echo "$includes" | jq -r '.[].arch' | sort -u | paste -sd, -)
          matrix="{\"include\":$includes}"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "archs=$archs" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    if: ${{ contains(needs.prepare-matrix.outputs.archs, 'amd64') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image (amd64)
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} ./auth-gateway
          docker save $DOCKER_IMAGE_NAME:${{ github.sha }} > app-image.tar

      - name: Upload amd64 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-gateway-image-amd64
          path: app-image.tar
          retention-days: 1

  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: prepare-matrix
    if: ${{ contains(needs.prepare-matrix.outputs.archs, 'arm64') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker image (arm64)
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} ./auth-gateway
          docker save $DOCKER_IMAGE_NAME:${{ github.sha }} > app-image.tar

      - name: Upload arm64 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-gateway-image-arm64
          path: app-image.tar
          retention-days: 1

  deploy:
    needs: [prepare-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false  # a failure on one host should not cancel the other
    env:
      REMOTE_PORT: 22
      ENV_FILE_PATH: /home/ubuntu/deploy/auth-gateway/.env
      PEM_FOLDER_PATH: /home/ubuntu/deploy/auth-gateway/.pem
      # All host secrets mapped upfront - dynamic secret refs aren't supported in GitHub Actions
      DEV_HOST: ${{ secrets.DEV_HOST }}
      TURN_HOST: ${{ secrets.TURN_HOST }}
      TTXAI_HOST: ${{ secrets.TTXAI_HOST }}
      TESTTURN_HOST: ${{ secrets.TESTTURN_HOST }}
      PATHQA_HOST: ${{ secrets.PATHQA_HOST }}
      REMOTE_USER: ${{ secrets.DEV_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
    steps:
      - name: Resolve host for environment
        run: |
          case "${{ matrix.environment }}" in
            dev)  echo "REMOTE_HOST=$DEV_HOST"  >> $GITHUB_ENV ;;
            ttxai) echo "REMOTE_HOST=$TTXAI_HOST" >> $GITHUB_ENV ;;
            testturn) echo "REMOTE_HOST=$TESTTURN_HOST" >> $GITHUB_ENV ;;
            turn) echo "REMOTE_HOST=$TURN_HOST" >> $GITHUB_ENV ;;
            pathqa) echo "REMOTE_HOST=$PATHQA_HOST" >> $GITHUB_ENV ;;
            *)    echo "Unknown environment: ${{ matrix.environment }}"; exit 1 ;;
          esac

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: auth-gateway-image-${{ matrix.arch }}

      - name: Deploy to ${{ matrix.environment }} host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -P $REMOTE_PORT \
              app-image.tar \
              $REMOTE_USER@$REMOTE_HOST:/tmp/

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST <<EOF
            DOCKER_IMAGE_NAME="${{ env.DOCKER_IMAGE_NAME }}"
            ENV_FILE_PATH="${{ env.ENV_FILE_PATH }}"
            PEM_FOLDER_PATH="${{ env.PEM_FOLDER_PATH }}"

            docker load -i /tmp/app-image.tar
            rm /tmp/app-image.tar

            docker stop \$DOCKER_IMAGE_NAME || true
            docker rm \$DOCKER_IMAGE_NAME || true

            if [ ! -f "\$ENV_FILE_PATH" ]; then
              echo "Error: .env file not found at \$ENV_FILE_PATH"
              exit 1
            fi

            if [ ! -d "\$PEM_FOLDER_PATH" ]; then
              echo "Error: .pem folder not found at \$PEM_FOLDER_PATH"
              exit 1
            fi

            docker ps -a | grep auth-gateway | awk '{print $1}' | xargs -r docker rm -f || true

            fuser -k 3030/tcp || true

            sleep 2

            docker run -d \
              --name \$DOCKER_IMAGE_NAME \
              --restart unless-stopped \
              -p 3030:3030 \
              --env-file \$ENV_FILE_PATH \
              -v \$PEM_FOLDER_PATH:/app/.pem \
              --mount type=bind,src=/etc/letsencrypt,dst=/etc/letsencrypt,ro \
              \$DOCKER_IMAGE_NAME:${{ github.sha }}

            docker image prune -f
            echo "Auth-gateway deployment to ${{ matrix.environment }} completed successfully"
          EOF

