# Portal Deploy
#
# Builds the portal Docker image once and deploys it to one or more remote hosts.
#
# Triggers:
#   - push to nas-ida5-development-master (portal/** changes) → deploys to nasstaging ONLY
#   - workflow_dispatch (manual) → deploys to the hosts selected via checkboxes
#     (nasprod is manual-dispatch-only; it is never deployed on push)
#
# Jobs:
#   1. prepare-matrix  Decides which environments to deploy based on trigger/inputs
#   2. build           Builds the Docker image and uploads it as a workflow artifact
#   3. deploy          Matrix job — downloads the artifact, swaps the container,
#                      and waits for it to become healthy
#
# Required secrets:
#   NASSTAGING_HOST, NASPROD_HOST — SSH hostnames/IPs
#   DEV_USER                      — SSH username
#   DEV_SSH_KEY                   — SSH private key
#
# Optional: create a GitHub Environment named "nasprod" (Settings → Environments)
# with "Required reviewers" so production deploys need manual approval.

name: Portal Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_nasstaging:
        description: 'Deploy to NAS Staging host'
        type: boolean
        default: true
      deploy_nasprod:
        description: 'Deploy to NAS Prod host'
        type: boolean
        default: false
      deploy_turn:
        description: 'Deploy to TURN host'
        type: boolean
        default: false
      deploy_testturn:
        description: 'Deploy to TESTTURN host'
        type: boolean
        default: false
      deploy_pathqa:
        description: 'Deploy to PATHQA host'
        type: boolean
        default: false
      deploy_demoai:
        description: 'Deploy to DEMOAI host'
        type: boolean
        default: false
  push:
    branches: [nas-ida5-development-master]
    paths:
      - 'portal/**'
      - '.github/workflows/portal-deploy.yml'

# Serialize runs: two pushes (or push + manual dispatch) must not deploy
# concurrently. New runs queue instead of cancelling an in-flight deploy.
concurrency:
  group: portal-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE_NAME: portal
  APP_PORT: 3004

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_targets: ${{ steps.set-matrix.outputs.has_targets }}
    steps:
      - name: Build deployment matrix
        id: set-matrix
        run: |
          includes='[]'
          if [ "${{ github.event_name }}" == "push" ]; then
            # On push, deploy to nasstaging only
            includes='[{"environment":"nasstaging"}]'
          else
            if [ "${{ inputs.deploy_nasstaging }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"nasstaging"}]')
            fi
            if [ "${{ inputs.deploy_nasprod }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"nasprod"}]')
            fi
          fi

          count=$(echo "$includes" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No hosts selected — nothing to deploy."
            echo "has_targets=false" >> $GITHUB_OUTPUT
          else
            echo "has_targets=true" >> $GITHUB_OUTPUT
          fi
          echo "matrix={\"include\":$includes}" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.build_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm i --production=false
        working-directory: portal

      - name: Build Docker image (${{ matrix.arch }}, native)
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} ./portal
          docker save $DOCKER_IMAGE_NAME:${{ github.sha }} > app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-image
          path: app-image.tar
          retention-days: 1

  deploy:
    needs: [prepare-matrix, build]
    if: needs.prepare-matrix.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false
    env:
      REMOTE_PORT: 22
      DEPLOY_DIR: /home/ubuntu/deploy/portal
      ENV_FILE_PATH: /home/ubuntu/deploy/portal/.env
      PEM_FOLDER_PATH: /home/ubuntu/deploy/portal/.pem
      DEV_HOST: ${{ secrets.DEV_HOST }}
      TTXAI_HOST: ${{ secrets.TTXAI_HOST }}
      DEMOAI_HOST: ${{ secrets.DEMOAI_HOST }}
      TESTTURN_HOST: ${{ secrets.TESTTURN_HOST }}
      TURN_HOST: ${{ secrets.TURN_HOST }}
      PATHQA_HOST: ${{ secrets.PATHQA_HOST }}
      REMOTE_USER: ${{ secrets.DEV_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
    steps:
      - name: Resolve host and set up SSH
        run: |
          case "${{ matrix.environment }}" in
            nasstaging) host="$NASSTAGING_HOST" ;;
            nasprod)    host="$NASPROD_HOST" ;;
            *)          echo "Unknown environment: ${{ matrix.environment }}"; exit 1 ;;
          esac
          echo "REMOTE_HOST=$host" >> $GITHUB_ENV
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin this host's SSH key (trust-on-first-use) so ssh/scp below can
          # use StrictHostKeyChecking=yes instead of trusting any host.
          ssh-keyscan -p $REMOTE_PORT -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Download image artifact for ${{ matrix.arch }}
        uses: actions/download-artifact@v4
        with:
          name: portal-image

      - name: Deploy to ${{ matrix.environment }} host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          REMOTE_TAR="/tmp/app-image-${{ matrix.environment }}-${{ github.run_id }}.tar"

          # Upload to a writable temp location first. Writing directly into
          # /home/ubuntu/deploy/portal can fail if that directory is not writable
          # by the deploy SSH user.
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -P $REMOTE_PORT \
              app-image-${{ matrix.arch }}.tar \
              $REMOTE_USER@$REMOTE_HOST:$REMOTE_TAR

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST <<EOF
            set -euo pipefail
            DOCKER_IMAGE_NAME="${{ env.DOCKER_IMAGE_NAME }}"
            ENV_FILE_PATH="${{ env.ENV_FILE_PATH }}"
            PEM_FOLDER_PATH="${{ env.PEM_FOLDER_PATH }}"
            REMOTE_TAR="$REMOTE_TAR"

            docker load -i "\$REMOTE_TAR"
            rm -f "\$REMOTE_TAR"

            # Validate prerequisites BEFORE touching the running container,
            # so any failure below leaves the current version serving traffic.
            if [ ! -f "\$ENV_FILE_PATH" ]; then
              echo "Error: .env file not found at \$ENV_FILE_PATH"
              exit 1
            fi
            if [ ! -d "\$PEM_FOLDER_PATH" ]; then
              echo "Error: .pem folder not found at \$PEM_FOLDER_PATH"
              exit 1
            fi

            # Stop and replace the existing container before starting the new image.
            docker stop "\$DOCKER_IMAGE_NAME" || true
            docker rm "\$DOCKER_IMAGE_NAME" || true

            docker run -d \
              --name "\$DOCKER_IMAGE_NAME" \
              --restart unless-stopped \
              -p 3004:3004 \
              --env-file "\$ENV_FILE_PATH" \
              -v "\$PEM_FOLDER_PATH:/app/.pem" \
              --mount type=bind,src=/etc/letsencrypt,dst=/etc/letsencrypt,ro \
              "\$DOCKER_IMAGE_NAME:${{ github.sha }}"

            echo "Waiting for \$DOCKER_IMAGE_NAME to become healthy..."
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "\$DOCKER_IMAGE_NAME" 2>/dev/null || true)
              echo "Attempt \$i: \$status"

              if docker inspect --format '{{.State.Health.Status}}' "\$DOCKER_IMAGE_NAME" 2>/dev/null | grep -q '^healthy$'; then
                echo "Portal deployment on ${{ matrix.environment }} successful! Ports: $(docker port "\$DOCKER_IMAGE_NAME" | tr '\n' ' ')"
                docker image prune -f || true
                exit 0
              fi
              sleep 5
            done

            echo "Portal deployment on ${{ matrix.environment }} FAILED — last 100 log lines:"
            docker logs --tail 100 "\$DOCKER_IMAGE_NAME" || true
            docker inspect --format '{{json .State}}' "\$DOCKER_IMAGE_NAME" || true
            docker image prune -f || true
            exit 1
          EOF
