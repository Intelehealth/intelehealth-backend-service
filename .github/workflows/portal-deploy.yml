# Portal Deploy
#
# Builds the portal Docker image once and deploys it to one or more remote hosts.
#
# Triggers:
#   - push to nas-ida5-development-master (portal/** changes) → deploys to nasstaging ONLY
#   - workflow_dispatch (manual) → deploys to the hosts selected via checkboxes
#     (nasprod is manual-dispatch-only; it is never deployed on push)
#
# Jobs:
#   1. prepare-matrix  Decides which environments to deploy based on trigger/inputs
#   2. build           Builds the Docker image and uploads it as a workflow artifact
#   3. deploy          Matrix job — downloads the artifact, swaps the container,
#                      and waits for it to become healthy
#
# Required secrets:
#   NASSTAGING_HOST, NASPROD_HOST — SSH hostnames/IPs
#   DEV_USER                      — SSH username
#   DEV_SSH_KEY                   — SSH private key
#
# Optional: create a GitHub Environment named "nasprod" (Settings → Environments)
# with "Required reviewers" so production deploys need manual approval.

name: Portal Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_nasstaging:
        description: 'Deploy to NAS Staging host'
        type: boolean
        default: true
      deploy_nasprod:
        description: 'Deploy to NAS Prod host'
        type: boolean
        default: false

  push:
    branches: [nas-ida5-development-master]
    paths:
      - 'portal/**'
      - '.github/workflows/portal-deploy.yml'

# Serialize runs: two pushes (or push + manual dispatch) must not deploy
# concurrently. New runs queue instead of cancelling an in-flight deploy.
concurrency:
  group: portal-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE_NAME: portal
  APP_PORT: 3004

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_targets: ${{ steps.set-matrix.outputs.has_targets }}
    steps:
      - name: Build deployment matrix
        id: set-matrix
        run: |
          includes='[]'
          if [ "${{ github.event_name }}" == "push" ]; then
            # On push, deploy to nasstaging only
            includes='[{"environment":"nasstaging"}]'
          else
            if [ "${{ inputs.deploy_nasstaging }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"nasstaging"}]')
            fi
            if [ "${{ inputs.deploy_nasprod }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"nasprod"}]')
            fi
          fi

          count=$(echo "$includes" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No hosts selected — nothing to deploy."
            echo "has_targets=false" >> $GITHUB_OUTPUT
          else
            echo "has_targets=true" >> $GITHUB_OUTPUT
          fi
          echo "matrix={\"include\":$includes}" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_targets == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm i --production=false
        working-directory: portal

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} ./portal
          docker save $DOCKER_IMAGE_NAME:${{ github.sha }} > app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-image
          path: app-image.tar
          retention-days: 1

  deploy:
    needs: [prepare-matrix, build]
    if: needs.prepare-matrix.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false  # a failure on one host should not cancel the other
    env:
      REMOTE_PORT: 22
      DEPLOY_DIR: /home/ubuntu/deploy/portal
      ENV_FILE_PATH: /home/ubuntu/deploy/portal/.env
      PEM_FOLDER_PATH: /home/ubuntu/deploy/portal/.pem
      # All host secrets mapped upfront — dynamic secret refs aren't supported in GitHub Actions
      NASSTAGING_HOST: ${{ secrets.NASSTAGING_HOST }}
      NASPROD_HOST: ${{ secrets.NASPROD_HOST }}
      REMOTE_USER: ${{ secrets.DEV_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
    steps:
      - name: Resolve host and set up SSH
        run: |
          case "${{ matrix.environment }}" in
            nasstaging) host="$NASSTAGING_HOST" ;;
            nasprod)    host="$NASPROD_HOST" ;;
            *)          echo "Unknown environment: ${{ matrix.environment }}"; exit 1 ;;
          esac
          echo "REMOTE_HOST=$host" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin this host's SSH key (trust-on-first-use) so ssh/scp below can
          # use StrictHostKeyChecking=yes instead of trusting any host.
          ssh-keyscan -p $REMOTE_PORT -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: portal-image

      - name: Deploy to ${{ matrix.environment }} host
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -P $REMOTE_PORT \
              app-image.tar \
              $REMOTE_USER@$REMOTE_HOST:$DEPLOY_DIR/app-image.tar

          # Values are passed in as env vars and the heredoc is quoted ('EOF'),
          # so nothing in the script gets expanded on the GitHub runner by mistake.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST \
              "IMAGE='$DOCKER_IMAGE_NAME' TAG='${{ github.sha }}' PORT='$APP_PORT' \
               DEPLOY_DIR='$DEPLOY_DIR' ENV_FILE_PATH='$ENV_FILE_PATH' \
               PEM_FOLDER_PATH='$PEM_FOLDER_PATH' TARGET='${{ matrix.environment }}' bash -s" <<'EOF'
          set -euo pipefail

          # 1. Validate config BEFORE touching the running container,
          #    so a failure here leaves the current version serving traffic.
          if [ ! -f "$ENV_FILE_PATH" ]; then
            echo "Error: .env file not found at $ENV_FILE_PATH"; exit 1
          fi
          if [ ! -d "$PEM_FOLDER_PATH" ]; then
            echo "Error: .pem folder not found at $PEM_FOLDER_PATH"; exit 1
          fi

          # 2. Load the new image
          docker load -i "$DEPLOY_DIR/app-image.tar"
          rm -f "$DEPLOY_DIR/app-image.tar"

          # 3. Remove the old container — Docker releases the port when it is removed
          docker ps -aq --filter "name=^/${IMAGE}$" | xargs -r docker rm -f

          # 4. Wait for the port to be free
          port_busy() { ss -ltn "( sport = :$PORT )" | grep -q ":$PORT"; }
          for i in $(seq 1 10); do
            port_busy || break
            sleep 1
          done

          # 5. If something still holds the port (e.g. an orphaned docker-proxy), log it and free it
          if port_busy; then
            echo "Port $PORT is still in use. Holder:"
            sudo -n ss -ltnp "( sport = :$PORT )" || true
            sudo -n fuser -k "$PORT/tcp" || true
            sleep 2
            if port_busy; then
              echo "Error: port $PORT could not be freed"; exit 1
            fi
          fi

          # 6. Start the new container
          docker run -d \
            --name "$IMAGE" \
            --restart unless-stopped \
            -p 0.0.0.0:$PORT:$PORT \
            --env-file "$ENV_FILE_PATH" \
            -v "$PEM_FOLDER_PATH":/app/.pem \
            --mount type=bind,src=/etc/letsencrypt,dst=/etc/letsencrypt,ro \
            --log-opt max-size=10m --log-opt max-file=3 \
            "$IMAGE:$TAG"

          # 7. Clean up old portal images — keep the current one + the previous one for rollback
          docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}}' \
            | grep -v ":${TAG}$" \
            | tail -n +2 \
            | xargs -r docker rmi || true
          docker image prune -f

          echo "Portal deployment to $TARGET completed"
          EOF

      - name: Verify deployment on ${{ matrix.environment }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST \
              "IMAGE='$DOCKER_IMAGE_NAME' TARGET='${{ matrix.environment }}' bash -s" <<'EOF'
          set -euo pipefail

          # Wait up to 90s. If the image defines a HEALTHCHECK, wait for "healthy";
          # otherwise just require the container to stay running without restarts.
          for i in $(seq 1 18); do
            sleep 5
            status=$(docker inspect -f '{{.State.Status}}' "$IMAGE")
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$IMAGE")
            restarts=$(docker inspect -f '{{.RestartCount}}' "$IMAGE")
            echo "[$((i*5))s] status=$status health=$health restarts=$restarts"

            if [ "$status" != "running" ] || [ "$restarts" -gt 0 ] || [ "$health" = "unhealthy" ]; then
              break
            fi
            if [ "$health" = "healthy" ] || { [ "$health" = "none" ] && [ "$i" -ge 3 ]; }; then
              echo "Portal deployment on $TARGET successful! Ports: $(docker port "$IMAGE" | tr '\n' ' ')"
              exit 0
            fi
          done

          echo "Deployment on $TARGET FAILED — last 100 log lines:"
          docker logs --tail 100 "$IMAGE"
          if [ "$health" != "none" ]; then
            echo "Last healthcheck results:"
            docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' "$IMAGE" | tail -20
          fi
          exit 1
          EOF
