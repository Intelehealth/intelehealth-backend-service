# Portal Deploy
#
# Builds the portal Docker image for each required architecture and deploys it to one or more remote hosts.
#
# Triggers:
#   - push to development_master (portal/** changes) → deploys to ALL hosts
#   - workflow_dispatch (manual) → deploys to selected hosts via checkboxes
#
# Architectures:
#   - amd64: dev, turn, ttxai, testturn
#   - arm64: pathqa
#
# Jobs:
#   1. prepare-matrix  Decides which environments (and their arch) to deploy, and whether
#                      pathqa (arm64) is needed at all this run.
#   2. build-amd64     Native amd64 build (fast, no emulation). Always runs.
#   3. build-arm64     Cross-build via QEMU/buildx. SKIPPED unless pathqa is being deployed,
#                      to avoid paying the emulation cost on every run.
#   Both build jobs run in parallel and use GitHub Actions cache for Docker layers,
#   so unchanged layers (e.g. the apk/apt toolchain layer) aren't rebuilt every time.
#   4. deploy          Matrix job — downloads the artifact matching each host's arch and deploys in parallel
#
# Required secrets:
#   DEV_HOST, TURN_HOST, TTXAI_HOST, TESTTURN_HOST, PATHQA_HOST — SSH hostnames/IPs
#   DEV_USER              — SSH username
#   DEV_SSH_KEY           — SSH private key
#
# To add a new host: add a secret for the hostname, map it in the deploy job env block,
# add a case in "Resolve host", add a boolean input, add it to the push matrix (with its arch),
# and make sure a build job exists for that arch.

name: Portal Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: 'Deploy to DEV host'
        type: boolean
        default: false
      deploy_turn:
        description: 'Deploy to TURN host'
        type: boolean
        default: true
      deploy_ttxai:
        description: 'Deploy to TTXAI host'
        type: boolean
        default: false
      deploy_testturn:
        description: 'Deploy to TESTTURN host'
        type: boolean
        default: false
      deploy_pathqa:
        description: 'Deploy to PATHQA host'
        type: boolean
        default: false
  push:
    branches: [development_master]
    paths:
      - 'portal/**'

env:
  DOCKER_IMAGE_NAME: portal

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      need_amd64: ${{ steps.set-matrix.outputs.need_amd64 }}
      need_arm64: ${{ steps.set-matrix.outputs.need_arm64 }}
    steps:
      - name: Build deployment matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # On push, deploy to all hosts
            matrix='{"include":[{"environment":"dev","arch":"amd64"},{"environment":"turn","arch":"amd64"},{"environment":"ttxai","arch":"amd64"},{"environment":"testturn","arch":"amd64"},{"environment":"pathqa","arch":"arm64"}]}'
            need_amd64=true
            need_arm64=true
          else
            # On manual dispatch, deploy only to selected hosts
            includes='[]'
            need_amd64=false
            need_arm64=false
            if [ "${{ inputs.deploy_dev }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"dev","arch":"amd64"}]')
              need_amd64=true
            fi
            if [ "${{ inputs.deploy_turn }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"turn","arch":"amd64"}]')
              need_amd64=true
            fi
            if [ "${{ inputs.deploy_ttxai }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"ttxai","arch":"amd64"}]')
              need_amd64=true
            fi
            if [ "${{ inputs.deploy_testturn }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"testturn","arch":"amd64"}]')
              need_amd64=true
            fi
            if [ "${{ inputs.deploy_pathqa }}" == "true" ]; then
              includes=$(echo "$includes" | jq -c '. += [{"environment":"pathqa","arch":"arm64"}]')
              need_arm64=true
            fi
            matrix="{\"include\":$includes}"
          fi
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "need_amd64=$need_amd64" >> $GITHUB_OUTPUT
          echo "need_arm64=$need_arm64" >> $GITHUB_OUTPUT

#  check-migrations:
#    runs-on: ubuntu-latest
#    outputs:
#      changed: ${{ steps.check-migrations.outputs.changed }}
#    steps:
#      - name: Checkout code
#        uses: actions/checkout@v4
#        with:
#          fetch-depth: 0
#      - name: Check for migration file changes
#        id: check-migrations
#        run: |
#          if [ "${{ github.event_name }}" != "push" ]; then
#            echo "changed=true" >> $GITHUB_OUTPUT
#          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
#            echo "changed=true" >> $GITHUB_OUTPUT
#          else
#            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^portal/migrations/" \
#              && echo "changed=true" >> $GITHUB_OUTPUT \
#              || echo "changed=false" >> $GITHUB_OUTPUT
#          fi

  build-amd64:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.need_amd64 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Native build — no emulation. Cache pulled from/pushed to GitHub Actions cache
      # so an unchanged Dockerfile layer (e.g. the OS package install) is reused instead
      # of rebuilt on every run.
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: portal
          platforms: linux/amd64
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}-amd64
          load: true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Save image
        run: docker save $DOCKER_IMAGE_NAME:${{ github.sha }}-amd64 > app-image-amd64.tar

      - name: Upload amd64 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-amd64
          path: app-image-amd64.tar
          retention-days: 1

  build-arm64:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.need_arm64 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: portal
          platforms: linux/arm64
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}-arm64
          load: true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Save image
        run: docker save $DOCKER_IMAGE_NAME:${{ github.sha }}-arm64 > app-image-arm64.tar

      - name: Upload arm64 image artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-arm64
          path: app-image-arm64.tar
          retention-days: 1

  deploy:
    needs: [prepare-matrix,  build-amd64, build-arm64]
    # build-amd64/build-arm64 may each be skipped if no host of that arch was selected —
    # don't let a skip count as a failure, only an actual failure should block deploy
    if: |
      always() &&
      needs.prepare-matrix.result == 'success' &&
      (needs.build-amd64.result == 'success' || needs.build-amd64.result == 'skipped') &&
      (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped')

    #  needs.check-migrations.result == 'success' &&
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false  # a failure on one host should not cancel the others
    env:
      REMOTE_PORT: 22
      ENV_FILE_PATH: /home/ubuntu/deploy/portal/.env
      PEM_FOLDER_PATH: /home/ubuntu/deploy/portal/.pem
      # All host secrets mapped upfront — dynamic secret refs aren't supported in GitHub Actions
      DEV_HOST: ${{ secrets.DEV_HOST }}
      TURN_HOST: ${{ secrets.TURN_HOST }}
      TTXAI_HOST: ${{ secrets.TTXAI_HOST }}
      TESTTURN_HOST: ${{ secrets.TESTTURN_HOST }}
      PATHQA_HOST: ${{ secrets.PATHQA_HOST }}
      REMOTE_USER: ${{ secrets.DEV_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
    steps:
      - name: Resolve host for environment
        run: |
          case "${{ matrix.environment }}" in
            dev)  echo "REMOTE_HOST=$DEV_HOST"  >> $GITHUB_ENV ;;
            turn) echo "REMOTE_HOST=$TURN_HOST" >> $GITHUB_ENV ;;
            ttxai) echo "REMOTE_HOST=$TTXAI_HOST" >> $GITHUB_ENV ;;
            testturn) echo "REMOTE_HOST=$TESTTURN_HOST" >> $GITHUB_ENV ;;
            pathqa) echo "REMOTE_HOST=$PATHQA_HOST" >> $GITHUB_ENV ;;
            *)    echo "Unknown environment: ${{ matrix.environment }}"; exit 1 ;;
          esac

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: portal-${{ matrix.arch }}

      - name: Deploy to ${{ matrix.environment }} host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Copy Docker image to remote host
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -P $REMOTE_PORT \
              app-image-${{ matrix.arch }}.tar \
              $REMOTE_USER@$REMOTE_HOST:/tmp/
          # SSH into remote host and deploy
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST <<EOF
            DOCKER_IMAGE_NAME="${{ env.DOCKER_IMAGE_NAME }}"
            ENV_FILE_PATH="${{ env.ENV_FILE_PATH }}"
            PEM_FOLDER_PATH="${{ env.PEM_FOLDER_PATH }}"
            docker load -i /tmp/app-image-${{ matrix.arch }}.tar
            rm /tmp/app-image-${{ matrix.arch }}.tar
            docker stop \$DOCKER_IMAGE_NAME || true
            docker rm \$DOCKER_IMAGE_NAME || true
            if [ ! -f "\$ENV_FILE_PATH" ]; then
              echo "Error: .env file not found at \$ENV_FILE_PATH"
              exit 1
            fi
            if [ ! -d "\$PEM_FOLDER_PATH" ]; then
              echo "Error: .pem folder not found at \$PEM_FOLDER_PATH"
              exit 1
            fi
            docker run -d \
              --name \$DOCKER_IMAGE_NAME \
              --restart unless-stopped \
              -p 3004:3004 \
              --env-file \$ENV_FILE_PATH \
              -v \$PEM_FOLDER_PATH:/app/.pem \
              --mount type=bind,src=/etc/letsencrypt,dst=/etc/letsencrypt,ro \
              \$DOCKER_IMAGE_NAME:${{ github.sha }}-${{ matrix.arch }}
            docker image prune -f
            echo "Portal deployment to ${{ matrix.environment }} completed successfully"
          EOF

#      - name: Run migrations on ${{ matrix.environment }} host
#        if: needs.check-migrations.outputs.changed == 'true'
##        run: |
#          mkdir -p ~/.ssh
#          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
#          chmod 600 ~/.ssh/deploy_key
#          ssh -i ~/.ssh/deploy_key \
#              -o StrictHostKeyChecking=no \
##              -p $REMOTE_PORT \
#              $REMOTE_USER@$REMOTE_HOST \
#              "docker exec ${{ env.DOCKER_IMAGE_NAME }} npm run migrate"

      - name: Verify deployment on ${{ matrix.environment }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST \
              "docker ps | grep $DOCKER_IMAGE_NAME && echo 'Portal deployment on ${{ matrix.environment }} successful!'"
