# Web RTC Deploy
#
# Builds the web-rtc Docker image once and deploys it to one or more remote hosts.
#
# Triggers:
#   - push to development_master (web-rtc/** changes) → deploys to ALL hosts
#   - workflow_dispatch (manual) → deploys to selected hosts via checkboxes
#
# Jobs:
#   1. prepare-matrix  Decides which environments to deploy based on trigger/inputs
#   2. build           Builds the Docker image and uploads it as a workflow artifact
#   3. deploy          Matrix job — downloads the artifact, swaps the container,
#                      runs migrations (if changed), and waits for it to become healthy
#
# Required secrets:
#   DEV_HOST, TTXAI_HOST, PATHQA_HOST, TESTTURN_HOST, TURN_HOST, DEMOAI_HOST   SSH hostnames/IPs
#   DEV_USER              SSH username
#   DEV_SSH_KEY           SSH private key
#
# Optional: create a GitHub Environment named "nasprod" (Settings → Environments)
# with "Required reviewers" so production deploys need manual approval.

name: Web RTC Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_nasstaging:
        description: 'Deploy to NAS Staging host'
        type: boolean
        default: true
      deploy_ttxai:
        description: 'Deploy to TTXAI host'
        type: boolean
        default: false
      deploy_pathqa:
        description: 'Deploy to PATHQA host'
        type: boolean
        default: false
      deploy_testturn:
        description: 'Deploy to TESTTURN host'
        type: boolean
        default: false
      deploy_turn:
        description: 'Deploy to TURN host'
        type: boolean
        default: false
      deploy_demoai:
        description: 'Deploy to DEMOAI host'
        type: boolean
        default: false
  push:
    branches: [nas-ida5-development-master]
    paths:
      - 'web-rtc/**'
      - '.github/workflows/web-rtc-deploy.yml'

# Serialize runs: two pushes (or push + manual dispatch) must not deploy
# concurrently. New runs queue instead of cancelling an in-flight deploy.
concurrency:
  group: web-rtc-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE_NAME: web-rtc
  APP_PORT: 3000

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_targets: ${{ steps.set-matrix.outputs.has_targets }}
    steps:
      - name: Build deployment matrix
        id: set-matrix
        run: |
          # Host -> CPU architecture map. Each arch builds natively on its
          # matching runner (see build_matrix below).
          dev_arch=amd64
          ttxai_arch=amd64
          testturn_arch=amd64
          pathqa_arch=arm64
          turn_arch=amd64
          demoai_arch=amd64

          if [ "${{ github.event_name }}" == "push" ]; then
            # On push, deploy to all hosts
            includes='[]'
            for env in dev testturn ttxai pathqa turn demoai; do
              arch_var="${env}_arch"
              includes=$(echo "$includes" | jq -c --arg e "$env" --arg a "${!arch_var}" '. += [{"environment":$e,"arch":$a}]')
            done
          else
            # On manual dispatch, deploy only to selected hosts.
            # NOTE: "inputs.deploy_x" is GitHub expression syntax, not a bash
            # variable - indirect expansion (${!...}) fails on the dots, so
            # each input is expanded literally via the case below.
            includes='[]'
            for env in dev ttxai pathqa testturn turn demoai; do
              case "$env" in
                dev)      selected="${{ inputs.deploy_dev }}" ;;
                ttxai)    selected="${{ inputs.deploy_ttxai }}" ;;
                pathqa)   selected="${{ inputs.deploy_pathqa }}" ;;
                testturn) selected="${{ inputs.deploy_testturn }}" ;;
                turn)     selected="${{ inputs.deploy_turn }}" ;;
                demoai)   selected="${{ inputs.deploy_demoai }}" ;;
              esac
              if [ "$selected" == "true" ]; then
                arch_var="${env}_arch"
                includes=$(echo "$includes" | jq -c --arg e "$env" --arg a "${!arch_var}" '. += [{"environment":$e,"arch":$a}]')
              fi
            done
          fi
          matrix="{\"include\":$includes}"
          # De-duplicated arch -> runner mapping for the build job.
          # arm64 builds natively on the ARM64 runner (no QEMU emulation),
          # amd64 on the standard x64 runner.
          build_includes=$(echo "$includes" | jq -c '[.[].arch] | unique | map(
            if . == "arm64" then {arch: ., os: "ubuntu-24.04-arm"}
            else {arch: ., os: "ubuntu-latest"} end
          )')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "build_matrix={\"include\":$build_includes}" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_targets == 'true'
    outputs:
      migrations_changed: ${{ steps.check-migrations.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-rtc/package-lock.json

      - name: Install dependencies
        run: npm i --production=false
        working-directory: web-rtc

      - name: Check for migration file changes
        id: check-migrations
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^web-rtc/migrations/" \
              && echo "changed=true" >> $GITHUB_OUTPUT \
              || echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} ./web-rtc
          docker save $DOCKER_IMAGE_NAME:${{ github.sha }} > app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-rtc-image
          path: app-image.tar
          retention-days: 1

  deploy:
    needs: [prepare-matrix, build]
    if: needs.prepare-matrix.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false  # a failure on one host should not cancel the other
    env:
      REMOTE_PORT: 22
      DEPLOY_DIR: /home/ubuntu/deploy/web-rtc
      ENV_FILE_PATH: /home/ubuntu/deploy/web-rtc/.env
      PEM_FOLDER_PATH: /home/ubuntu/deploy/web-rtc/.pem
      # All host secrets mapped upfront — dynamic secret refs aren't supported in GitHub Actions
      DEV_HOST: ${{ secrets.DEV_HOST }}
      TTXAI_HOST: ${{ secrets.TTXAI_HOST }}
      PATHQA_HOST: ${{ secrets.PATHQA_HOST }}
      TESTTURN_HOST: ${{ secrets.TESTTURN_HOST }}
      TURN_HOST: ${{ secrets.TURN_HOST }}
      DEMOAI_HOST: ${{ secrets.DEMOAI_HOST }}
      REMOTE_USER: ${{ secrets.DEV_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
    steps:
      - name: Resolve host and set up SSH
        run: |
          case "${{ matrix.environment }}" in
            dev)      echo "REMOTE_HOST=$DEV_HOST" >> $GITHUB_ENV ;;
            ttxai)    echo "REMOTE_HOST=$TTXAI_HOST" >> $GITHUB_ENV ;;
            pathqa)   echo "REMOTE_HOST=$PATHQA_HOST" >> $GITHUB_ENV ;;
            testturn) echo "REMOTE_HOST=$TESTTURN_HOST" >> $GITHUB_ENV ;;
            turn)     echo "REMOTE_HOST=$TURN_HOST" >> $GITHUB_ENV ;;
            demoai)   echo "REMOTE_HOST=$DEMOAI_HOST" >> $GITHUB_ENV ;;
            *)        echo "Unknown environment: ${{ matrix.environment }}"; exit 1 ;;
          esac
          echo "REMOTE_HOST=$host" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin this host's SSH key (trust-on-first-use) so ssh/scp below can
          # use StrictHostKeyChecking=yes instead of trusting any host.
          ssh-keyscan -p $REMOTE_PORT -H "$host" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: web-rtc-image

      - name: Deploy to ${{ matrix.environment }} host
        run: |
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -P $REMOTE_PORT \
              app-image.tar \
              $REMOTE_USER@$REMOTE_HOST:$DEPLOY_DIR/app-image.tar

          # Values are passed in as env vars and the heredoc is quoted ('EOF'),
          # so nothing in the script gets expanded on the GitHub runner by mistake.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST <<EOF
            set -e
            DOCKER_IMAGE_NAME="${{ env.DOCKER_IMAGE_NAME }}"
            ENV_FILE_PATH="${{ env.ENV_FILE_PATH }}"
            PEM_FOLDER_PATH="${{ env.PEM_FOLDER_PATH }}"
            REMOTE_TAR="$REMOTE_TAR"
            docker load -i "\$REMOTE_TAR"
            rm "\$REMOTE_TAR"
            docker stop \$DOCKER_IMAGE_NAME || true
            docker rm \$DOCKER_IMAGE_NAME || true
            if [ ! -f "\$ENV_FILE_PATH" ]; then
              echo "Error: .env file not found at \$ENV_FILE_PATH"
              exit 1
            fi
            if [ ! -d "\$PEM_FOLDER_PATH" ]; then
              echo "Error: .pem folder not found at \$PEM_FOLDER_PATH"
              exit 1
            fi
            lsof -ti:3000 | xargs kill -9 2>/dev/null || true
            docker ps -a | grep \$DOCKER_IMAGE_NAME | awk '{print \$1}' | xargs -r docker rm -f 2>/dev/null || true
            sleep 2
            if port_busy; then
              echo "Error: port $PORT could not be freed"; exit 1
            fi
          fi

          # 6. Start the new container
          docker run -d \
            --name "$IMAGE" \
            --restart unless-stopped \
            -p 0.0.0.0:$PORT:$PORT \
            --env-file "$ENV_FILE_PATH" \
            -v "$PEM_FOLDER_PATH":/app/.pem \
            --mount type=bind,src=/etc/letsencrypt,dst=/etc/letsencrypt,ro \
            --log-opt max-size=10m --log-opt max-file=3 \
            "$IMAGE:$TAG"

          # 7. Clean up old web-rtc images — keep the current one + the previous one for rollback
          docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}}' \
            | grep -v ":${TAG}$" \
            | tail -n +2 \
            | xargs -r docker rmi || true
          docker image prune -f

          echo "Web-rtc deployment to $TARGET completed"
          EOF
